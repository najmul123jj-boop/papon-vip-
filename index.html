<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HGZY VIP AI - SIGNAL PANEL</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        #gameFrame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* ─── FALLING DOTS CANVAS ─── */
        #dotCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99998;
            pointer-events: none;
        }

        /* ─── OFFLINE OVERLAY ─── */
        #offline-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.95);
            color: #fff;
            padding: 14px 32px;
            border-radius: 60px;
            z-index: 100000;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 2px;
            display: none;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            text-transform: uppercase;
            font-family: 'Orbitron', monospace;
        }

        /* ─── DRAGGABLE PANEL (BALL STYLE) ─── */
        #signalPanel {
            width: 200px;
            position: fixed;
            z-index: 99999;
            cursor: grab;
            touch-action: none;
            display: none;
            top: 70px;
            left: 16px;
        }

        #signalPanel:active {
            cursor: grabbing;
        }

        .glass-panel {
            background: rgba(6, 10, 20, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 14px 12px 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 242, 255, 0.06) inset;
            position: relative;
            overflow: hidden;
            transition: opacity 0.4s ease;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: conic-gradient(from 0deg, transparent, var(--neon-cyan, #00f2ff), transparent, var(--neon-pink, #ff00ea), transparent);
            animation: rotateBorder 8s linear infinite;
            z-index: -1;
            opacity: 0.25;
        }

        @keyframes rotateBorder {
            100% {
                transform: rotate(360deg);
            }
        }

        /* ─── AUTH OVERLAY ─── */
        #auth-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, #0b1428, #02040a);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            padding: 14px;
        }

        .login-card {
            width: 100%;
            padding: 16px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            border: 1px solid rgba(0, 242, 255, 0.15);
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .login-card .lock-icon {
            font-size: 24px;
            margin-bottom: 4px;
            display: block;
        }

        .login-card label {
            color: #00f2ff;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        #passInput {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #2a2a3a;
            padding: 8px 8px;
            color: #fff;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            font-size: 12px;
            font-weight: 700;
            outline: none;
            margin-bottom: 10px;
            transition: 0.3s;
            letter-spacing: 1px;
            font-family: 'Orbitron', monospace;
        }

        #passInput:focus {
            border-color: #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.12);
        }

        #loginBtn {
            background: linear-gradient(135deg, #00f2ff, #0066ff);
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 10px;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 18px rgba(0, 242, 255, 0.3);
            transition: 0.25s;
            width: 100%;
            font-family: 'Orbitron', monospace;
        }

        #loginBtn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 24px rgba(0, 242, 255, 0.4);
        }

        /* ─── PANEL HEADER ─── */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .brand {
            font-weight: 900;
            font-size: 8px;
            color: #00f2ff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .brand span {
            color: #ff00ea;
        }

        #network-status {
            font-size: 6px;
            color: #00e676;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 3px;
            font-weight: 700;
        }

        #network-status .dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #00e676;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.15;
            }
        }

        /* ─── STATS GRID ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 8px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 2px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-label {
            font-size: 5px;
            text-transform: uppercase;
            color: #7a7a8a;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 1px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 12px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.12);
        }

        /* ─── PREDICTION BOX ─── */
        .prediction-box {
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.6), rgba(10, 15, 30, 0.8));
            border-radius: 16px;
            padding: 10px 4px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 8px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .prediction-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(0, 242, 255, 0.03), transparent 70%);
            pointer-events: none;
        }

        #box-status {
            font-size: 6px;
            color: #00f2ff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
            position: relative;
            z-index: 1;
            font-weight: 700;
        }

        #prediction-text {
            font-size: 32px;
            font-weight: 950;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
            line-height: 1.1;
            text-shadow: 0 0 30px currentColor;
            transition: all 0.3s ease;
        }

        #prediction-text.big-text {
            color: #ff1100;
            text-shadow: 0 0 40px rgba(255, 17, 0, 0.4), 0 0 80px rgba(255, 17, 0, 0.15);
        }

        #prediction-text.small-text {
            color: #ffea00;
            text-shadow: 0 0 40px rgba(255, 234, 0, 0.3), 0 0 80px rgba(255, 234, 0, 0.1);
        }

        #prediction-text.analyzing {
            font-size: 12px !important;
            color: #00f2ff !important;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.25);
            animation: pulseText 0.9s infinite;
        }

        @keyframes pulseText {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.15;
            }
        }

        /* ─── DETAILS ROW ─── */
        .details-row {
            display: flex;
            justify-content: space-around;
            margin-top: 5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 5px;
            position: relative;
            z-index: 1;
        }

        .detail-item {
            text-align: center;
        }

        .detail-item .stat-label {
            font-size: 5px;
            color: #7a7a8a;
        }

        .val {
            font-weight: 900;
            font-size: 14px;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.08);
        }

        #color-display {
            font-weight: 900;
            font-size: 14px;
            transition: color 0.3s;
        }

        /* ─── PROGRESS BAR ─── */
        .meter-bg {
            height: 3px;
            background: #11161f;
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2ff, #ff00ea);
            transition: width 0.4s linear;
            border-radius: 6px;
        }

        /* ─── HISTORY DOTS ─── */
        .history-list {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
            min-height: 20px;
        }

        .h-dot {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .h-dot.bg-red {
            background: #ff1744;
        }
        .h-dot.bg-green {
            background: #00e676;
        }
        .h-dot.bg-violet {
            background: #b388ff;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 520px) {
            #signalPanel {
                width: 170px;
                top: 50px;
                left: 10px;
            }
            .glass-panel {
                padding: 10px 8px 8px;
                border-radius: 22px;
            }
            #prediction-text {
                font-size: 26px;
            }
            .stat-value {
                font-size: 10px;
            }
            .val {
                font-size: 12px;
            }
            .h-dot {
                width: 15px;
                height: 15px;
                font-size: 6px;
            }
            .brand {
                font-size: 7px;
            }
            .login-card {
                padding: 12px 10px;
            }
            #passInput {
                font-size: 10px;
                padding: 6px 6px;
            }
            #loginBtn {
                font-size: 8px;
                padding: 6px 12px;
            }
            #offline-overlay {
                font-size: 12px;
                padding: 10px 20px;
            }
            #prediction-text.analyzing {
                font-size: 10px !important;
            }
            .stat-label {
                font-size: 4px;
            }
            #box-status {
                font-size: 5px;
            }
        }

        @media (max-width: 400px) {
            #signalPanel {
                width: 150px;
                top: 40px;
                left: 6px;
            }
            #prediction-text {
                font-size: 20px;
            }
            .stat-value {
                font-size: 9px;
            }
            .val {
                font-size: 10px;
            }
            .h-dot {
                width: 13px;
                height: 13px;
                font-size: 5px;
            }
            .glass-panel {
                padding: 8px 6px 6px;
                border-radius: 18px;
            }
            .brand {
                font-size: 6px;
            }
            .stats-grid {
                gap: 3px;
            }
            .stat-card {
                padding: 3px 2px;
                border-radius: 8px;
            }
            .prediction-box {
                padding: 6px 3px 5px;
                min-height: 60px;
                border-radius: 12px;
            }
            #prediction-text.analyzing {
                font-size: 8px !important;
            }
        }
    </style>
</head>

            <div id="auth-overlay">

            <div class="panel-header">

                </div>

            <div class="prediction-box">

    <!-- ─── FIREBASE SDK ─── -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        // ─── FIREBASE CONFIG ───
        const firebaseConfig = {
            apiKey: "AIzaSyBPBQOeApFZQwGX8G4mZxhY5C2jjN6VWmU",
            authDomain: "dkwin-panel-ai.firebaseapp.com",
            databaseURL: "https://dkwin-panel-ai-default-rtdb.firebaseio.com",
            projectId: "dkwin-panel-ai",
            storageBucket: "dkwin-panel-ai.firebasestorage.app",
            messagingSenderId: "925573387640",
            appId: "1:925573387640:web:8faf648b0b89933c89e48d",
            measurementId: "G-X3ZFCRWEH8"
        };

        let firebaseReady = false;
        let database = null;

        try {
            const app = firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            firebaseReady = true;
            console.log('🔥 Firebase connected.');
        } catch (err) {
            console.warn('⚠ Firebase init error:', err);
            firebaseReady = false;
        }

        // ─── FALLING DOTS ───
        (function initDots() {
            const canvas = document.getElementById('dotCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            const dots = [];
            const DOT_COUNT = 35;
            const colors = ['#ff1744', '#00e676', '#b388ff', '#ffea00', '#00f2ff', '#ff9100'];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Dot {
                constructor() {
                    this.reset();
                    this.y = Math.random() * height - height;
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = -10 - Math.random() * 80;
                    this.radius = 3 + Math.random() * 6;
                    this.speed = 0.8 + Math.random() * 1.8;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = 0.4 + Math.random() * 0.6;
                    this.wobble = Math.random() * 0.03;
                    this.phase = Math.random() * Math.PI * 2;
                }
                update() {
                    this.y += this.speed;
                    this.x += Math.sin(this.phase) * this.wobble;
                    this.phase += 0.02;
                    if (this.y > height + 20) this.reset();
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.alpha * 0.7;
                    ctx.fill();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            for (let i = 0; i < DOT_COUNT; i++) {
                const d = new Dot();
                d.y = Math.random() * height;
                dots.push(d);
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (const dot of dots) {
                    dot.update();
                    dot.draw();
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // ─── MAIN APPLICATION ───
        (function() {
            'use strict';

            const panel = document.getElementById('signalPanel');
            const offlineMsg = document.getElementById('offline-overlay');
            const authOverlay = document.getElementById('auth-overlay');
            const passInput = document.getElementById('passInput');
            const loginBtn = document.getElementById('loginBtn');

            const periodDisplay = document.getElementById('period-display');
            const timerDisplay = document.getElementById('timer-display');
            const progressBar = document.getElementById('progress-bar');
            const predictionText = document.getElementById('prediction-text');
            const boxStatus = document.getElementById('box-status');
            const numDisplay = document.getElementById('num-display');
            const colorDisplay = document.getElementById('color-display');
            const historyRow = document.getElementById('history-row');
            const netStatus = document.getElementById('network-status');

            const ACCESS_KEY = 'VIP100';
            const CYCLE_TIME = 30;
            const MAX_HISTORY = 10;

            let isLoggedIn = false;
            let lastPeriod = '';
            let isOnline = true;

            function checkNetwork() {
                const online = navigator.onLine;
                isOnline = online;
                if (online && isLoggedIn) {
                    panel.style.display = 'block';
                    offlineMsg.style.display = 'none';
                    netStatus.innerHTML = '<span class="dot"></span> LIVE';
                    netStatus.style.color = '#00e676';
                } else if (!online) {
                    panel.style.display = 'none';
                    offlineMsg.style.display = 'block';
                    netStatus.innerHTML = '● OFFLINE';
                    netStatus.style.color = '#ff1744';
                } else if (online && !isLoggedIn) {
                    panel.style.display = 'block';
                    offlineMsg.style.display = 'none';
                    netStatus.innerHTML = '<span class="dot"></span> LIVE';
                    netStatus.style.color = '#00e676';
                }
            }

            window.addEventListener('online', checkNetwork);
            window.addEventListener('offline', checkNetwork);

            function validateKey() {
                const val = passInput.value.trim();
                if (val === ACCESS_KEY) {
                    isLoggedIn = true;
                    authOverlay.style.display = 'none';
                    checkNetwork();
                    if (isOnline) panel.style.display = 'block';
                    document.getElementById('gameFrame').focus();
                    loadHistoryFromFirebase();
                } else {
                    alert('⛔ ACCESS DENIED');
                    passInput.value = '';
                    passInput.focus();
                }
            }

            loginBtn.addEventListener('click', validateKey);
            passInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') validateKey();
            });

            function setAnalyzing() {
                predictionText.textContent = 'SCANNING…';
                predictionText.className = 'analyzing';
                boxStatus.textContent = 'AI ANALYZING…';
                numDisplay.textContent = '--';
                colorDisplay.textContent = '---';
                colorDisplay.style.color = '#888';
            }

            function setSignal(isBig, num1, num2, colorName, colorHex, colorClass) {
                predictionText.textContent = isBig ? 'BIG' : 'SMALL';
                predictionText.className = isBig ? 'big-text' : 'small-text';
                boxStatus.textContent = '🎯 SIGNAL';
                numDisplay.textContent = num1 + ',' + num2;
                colorDisplay.textContent = colorName;
                colorDisplay.style.color = colorHex;

                const dot = document.createElement('div');
                dot.className = 'h-dot ' + colorClass;
                dot.textContent = num1;
                historyRow.prepend(dot);
                while (historyRow.children.length > MAX_HISTORY) {
                    historyRow.removeChild(historyRow.lastChild);
                }

                saveSignalToFirebase({
                    period: periodDisplay.textContent,
                    prediction: isBig ? 'BIG' : 'SMALL',
                    num1: num1,
                    num2: num2,
                    color: colorName,
                    colorHex: colorHex,
                    colorClass: colorClass,
                    timestamp: Date.now()
                });
            }

            function saveSignalToFirebase(data) {
                if (!firebaseReady || !isLoggedIn) return;
                try {
                    const ref = database.ref('signals/' + data.period);
                    ref.set(data).catch(err => console.warn('Save error:', err));
                } catch (e) { console.warn('Save exception:', e); }
            }

            function loadHistoryFromFirebase() {
                if (!firebaseReady || !isLoggedIn) return;
                try {
                    const ref = database.ref('signals');
                    ref.orderByKey().limitToLast(MAX_HISTORY).once('value', (snapshot) => {
                        const signals = [];
                        snapshot.forEach((child) => signals.push(child.val()));
                        signals.reverse();
                        historyRow.innerHTML = '';
                        signals.forEach((sig) => {
                            const dot = document.createElement('div');
                            dot.className = 'h-dot ' + (sig.colorClass || 'bg-red');
                            dot.textContent = sig.num1 || '?';
                            historyRow.appendChild(dot);
                        });
                        while (historyRow.children.length > MAX_HISTORY) {
                            historyRow.removeChild(historyRow.lastChild);
                        }
                        console.log('📜 Loaded ' + signals.length + ' signals.');
                    }).catch(err => console.warn('Load error:', err));
                } catch (e) { console.warn('Load exception:', e); }
            }

            function runEngine() {
                if (!isLoggedIn || !isOnline) return;

                const now = new Date();
                const sec = now.getSeconds();
                const remaining = CYCLE_TIME - (sec % CYCLE_TIME);

                const totalSec = (now.getHours() * 3600) + (now.getMinutes() * 60) + sec;
                const periodIdx = Math.floor(totalSec / CYCLE_TIME) + 1;
                const periodStr = String(periodIdx).padStart(5, '0');

                timerDisplay.textContent = remaining;
                periodDisplay.textContent = periodStr;
                const progress = ((CYCLE_TIME - remaining) / CYCLE_TIME) * 100;
                progressBar.style.width = Math.min(100, progress) + '%';

                if (remaining <= 6 && remaining > 0) {
                    setAnalyzing();
                }

                if (periodStr !== lastPeriod && remaining === CYCLE_TIME) {
                    lastPeriod = periodStr;
                    generateSignal();
                }
            }

            function generateSignal() {
                const isBig = Math.random() < 0.60;
                let pool = isBig ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
                const idx1 = Math.floor(Math.random() * pool.length);
                let n1 = pool[idx1];
                pool.splice(idx1, 1);
                const idx2 = Math.floor(Math.random() * pool.length);
                let n2 = pool[idx2];

                let colorName, colorHex, colorClass;
                if (n1 === 0 || n1 === 5) {
                    colorName = 'VIOLET';
                    colorHex = '#b388ff';
                    colorClass = 'bg-violet';
                } else if (n1 % 2 === 0) {
                    colorName = 'RED';
                    colorHex = '#ff1744';
                    colorClass = 'bg-red';
                } else {
                    colorName = 'GREEN';
                    colorHex = '#00e676';
                    colorClass = 'bg-green';
                }

                setSignal(isBig, n1, n2, colorName, colorHex, colorClass);
            }

            /* ─── DRAG ─── */
            let isDragging = false;
            let startX = 0,
                startY = 0,
                offsetX = 0,
                offsetY = 0;

            function onDragStart(e) {
                const target = e.target;
                if (target.tagName === 'INPUT' || target.tagName === 'BUTTON') return;
                const touch = e.type === 'touchstart' ? e.touches[0] : e;
                startX = touch.clientX - offsetX;
                startY = touch.clientY - offsetY;
                isDragging = true;
                panel.style.cursor = 'grabbing';
            }

            function onDragMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                const touch = e.type === 'touchmove' ? e.touches[0] : e;
                offsetX = touch.clientX - startX;
                offsetY = touch.clientY - startY;
                panel.style.transform = 'translate3d(' + offsetX + 'px, ' + offsetY + 'px, 0)';
            }

            function onDragEnd() {
                isDragging = false;
                panel.style.cursor = 'grab';
            }

            panel.addEventListener('mousedown', onDragStart);
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            panel.addEventListener('touchstart', onDragStart, { passive: true });
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('touchend', onDragEnd, { passive: true });

            /* ─── INIT ─── */
            checkNetwork();
            setInterval(runEngine, 1000);
            setTimeout(runEngine, 300);
            if (navigator.onLine) panel.style.display = 'block';
            setTimeout(() => { if (!isLoggedIn) passInput.focus(); }, 500);

            console.log('🔮 HGZY VIP AI Panel (BALL STYLE) loaded.');
        })();
    </script>
</body>
</html>
