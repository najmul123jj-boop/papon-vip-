<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>HGZY </title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* --- Reset & Base Styles --- */
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
        }

        /* Game Background Iframe */
        .iframe-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        iframe { 
            width: 100%; height: 100%; border: none; display: block;
        }

        /* --- Premium Signal Panel (Drag Box) --- */
        .box { 
            width: 220px; 
            height: auto;
            background: rgba(10, 10, 12, 0.85); 
            border-radius: 20px; 
            color: #ffffff; 
            text-align: center; 
            padding: 18px; 
            position: fixed; 
            top: 100px; 
            right: 15px;
            z-index: 9999; 
            cursor: grab; 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            box-sizing: border-box;
            touch-action: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.35);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        
        .box:active { cursor: grabbing; }

        /* Header & Logo */
        .panel-header {
            display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;
        }

        .premium-logo-area {
            position: relative; width: 65px; height: 65px;
            display: flex; align-items: center; justify-content: center;
        }

        .logo-image {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2); z-index: 2;
        }

        .logo-ring {
            position: absolute; width: 115%; height: 115%;
            border: 2px dashed rgba(0, 255, 102, 0.6);
            border-radius: 50%; animation: spinRing 4s infinite linear; z-index: 1;
        }

        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        /* Server Status Badge */
        .server-badge {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 10px; font-weight: 800; color: #fff;
            text-transform: uppercase;
            width: 100%; letter-spacing: 0.8px;
        }
        
        .vpn-dot {
            width: 8px; height: 8px; background-color: #00ff66;
            border-radius: 50%; box-shadow: 0 0 8px #00ff66;
        }

        /* Login Section */
        .login-part { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .login-part input { 
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(0, 255, 102, 0.5); border-radius: 10px; 
            color: #fff; font-size: 14px; text-align: center; outline: none; box-sizing: border-box;
            font-weight: 600;
        }
        .login-btn { 
            width: 100%; padding: 12px; background: #00ff66; color: #000; 
            border: none; border-radius: 10px; font-weight: 900; cursor: pointer; 
            font-size: 13px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,255,102,0.4);
            letter-spacing: 0.5px;
        }
        .login-btn:hover { background: #00dd55; }

        /* Signal Application Section */
        .app-part { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        
        /* Period Box */
        .period-top-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 8px; width: 100%; text-align: center; box-sizing: border-box;
        }

        .period-label { font-size: 10px; color: #aaa; display: block; font-weight: 700; margin-bottom: 3px; letter-spacing: 0.5px;}
        
        #periodID { 
            font-size: 15px; font-weight: 800; display: block; color: #00ff66; letter-spacing: 0.8px;
        }

        /* Timer Ultra Crystal Clear */
        .timer-container { text-align: center; width: 100%; }
        .timer-txt { 
            font-size: 14px; color: #ffffff; font-weight: 800; 
            background: rgba(255, 170, 0, 0.15); padding: 6px; 
            border-radius: 8px; border: 1px solid rgba(255, 170, 0, 0.3);
            letter-spacing: 0.5px;
        }
        #timer { color: #ffaa00; font-size: 16px; font-weight: 900; }

        /* Signal Output Area - Ultra Bold & Distinct */
        #signalContainer {
            display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.15); padding-top: 12px;
        }

        .signal-label { font-size: 11px; color: #ffffff; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; opacity: 0.8; }

        .output-row { display: flex; justify-content: center; align-items: center; width: 100%; }
        
        /* Big Size Text Screen */
        .size-txt { 
            font-size: 44px; font-weight: 950; text-transform: uppercase; 
            line-height: 1; letter-spacing: 2px;
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes pulseText {
            0% { transform: scale(0.96); }
            100% { transform: scale(1.04); }
        }

        /* Signal Glow Themes */
        .res-big { 
            color: #00ccff; 
            text-shadow: 0 0 20px rgba(0, 204, 255, 0.9), 0 0 35px rgba(0, 204, 255, 0.6); 
        }
        .res-small { 
            color: #ff3366; 
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.9), 0 0 35px rgba(255, 51, 102, 0.6); 
        }
        
        /* Real-time Dynamic Panel Glow borders */
        .box.glow-big { border-color: #00ccff; box-shadow: 0 0 25px rgba(0, 204, 255, 0.5); }
        .box.glow-small { border-color: #ff3366; box-shadow: 0 0 25px rgba(255, 51, 102, 0.5); }

        .processing { 
            font-size: 13px; color: #ffaa00; animation: blink 0.6s infinite; 
            display: block; font-weight: 900; letter-spacing: 1px; margin-top: 5px;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
        }
        
        .no-net { color: #ff3333; font-size: 12px; font-weight: 900; letter-spacing: 0.5px; }
        
        @keyframes blink { 50% { opacity: 0.3; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe src="https://hgnice.cc/#/register?invitationCode=511711502736"></iframe>
    </div>

    <div class="box" id="dragBox">
        
        <div class="panel-header">
            <div class="premium-logo-area">
                <div class="logo-ring"></div>
                <img class="logo-image" src="https://i.postimg.cc/LqKYxR91/image.png" alt="VIP Logo">
            </div>
            <div class="server-badge">
                <span id="serverStatusText">CONNECTING...</span>
                <div class="vpn-dot" id="serverDot"></div>
            </div>
        </div>

        <div id="loginPart" class="login-part">
            <input type="password" id="passInput" placeholder="Enter System Password">
            <button class="login-btn" onclick="checkPass()">LOGIN SYSTEM</button>
        </div>

        <div id="appPart" class="app-part hidden">
            <div class="period-top-box">
                <span class="period-label">HGZY MARKET (30s)</span>
                <span id="periodID">Syncing...</span>
            </div>
            
            <div class="timer-container">
                <div class="timer-txt">TIME REMAINING: <span id="timer">--</span>s</div>
            </div>
            
            <div id="signalContainer">
                <span class="signal-label"></span>
                <div id="predictionOutput" style="width:100%;">
                    <div class="output-row">
                        <span class="size-txt" id="predictSize">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyA4MXyCyvpAL8NQ23j3TWxiszPofWInVA",
            authDomain: "wingo-ai-624fb.firebaseapp.com",
            databaseURL: "https://wingo-ai-624fb-default-rtdb.firebaseio.com",
            projectId: "wingo-ai-624fb",
            appId: "1:266167882150:web:7f0f83606dfd4bcd8aff67"
        };
        firebase.initializeApp(firebaseConfig);
        
        let lastP = null;
        let _active = false;
        let currentSignal = null;

        // --- Drag Logic ---
        const box = document.getElementById("dragBox");
        let activeDrag = false, currentX = 0, currentY = 0, initialX = 0, initialY = 0;

        function dragStart(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.classList.contains('vpn-dot')) return;
            
            const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
            
            initialX = clientX - currentX;
            initialY = clientY - currentY;
            activeDrag = true;
        }

        function dragEnd() { activeDrag = false; }

        function drag(e) {
            if (activeDrag) {
                e.preventDefault();
                const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                
                currentX = clientX - initialX;
                currentY = clientY - initialY;
                
                box.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }
        }

        window.addEventListener("mousedown", dragStart);
        window.addEventListener("mouseup", dragEnd);
        window.addEventListener("mousemove", drag);
        window.addEventListener("touchstart", dragStart, { passive: false });
        window.addEventListener("touchend", dragEnd);
        window.addEventListener("touchmove", drag, { passive: false });

        // --- Internet Connectivity Logic (Bangladesh Server) ---
        function updateConnectionStatus() {
            const statusText = document.getElementById('serverStatusText');
            const dot = document.getElementById('serverDot');
            
            if (navigator.onLine) {
                // Restore panel visibility if online
                box.classList.remove('hidden');
                
                statusText.innerText = "BD SERVER ONLINE";
                statusText.style.color = "#ffffff";
                dot.style.backgroundColor = "#00ff66";
                dot.style.boxShadow = "0 0 8px #00ff66";
            } else {
                // Completely hide the panel if there is no internet/data
                box.classList.add('hidden');
                
                statusText.innerText = "NO CONNECTION";
                statusText.style.color = "#ff3333";
                dot.style.backgroundColor = "#ff0000";
                dot.style.boxShadow = "0 0 8px #ff0000";
                
                if(_active) {
                    document.getElementById('predictionOutput').innerHTML = '<span class="no-net">NO INTERNET CONNECTION</span>';
                    box.classList.remove('glow-big', 'glow-small');
                }
            }
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // --- Login ---
        function checkPass() {
            if (document.getElementById('passInput').value.trim() === "VIP100") {
                document.getElementById('loginPart').classList.add('hidden'); 
                document.getElementById('appPart').classList.remove('hidden'); 
                _active = true;
                
                updateConnectionStatus();
                fetchData(); 
                setInterval(loop, 1000); 
                setInterval(fetchData, 5000); 
            } else { 
                alert("⚠️ Access Denied! Incorrect Password."); 
            }
        }

        // --- Data Fetching (Bangladesh Routing) ---
        async function fetchData() {
            if (!navigator.onLine) return;

            try {
                // Bangladesh server routed endpoint for low-latency BD access
                const res = await fetch("https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?r=" + Date.now() + "&region=BD");
                const json = await res.json();
                if (json.data?.list.length > 0) {
                    lastP = (BigInt(json.data.list[0].issueNumber) + 1n).toString();
                }
            } catch (e) { 
                const now = new Date();
                const totalSeconds = Math.floor(now.getTime() / 1000);
                lastP = Math.floor(totalSeconds / 30).toString(); 
            }
        }

        // --- Signal Algorithm ---
        function analyzeQuantumSignal(period) {
            let hash1 = 0; 
            const seed1 = period + "DKWIN_BD_SERVER_SECURE_2026_30S_NUM_A";
            
            for (let i = 0; i < seed1.length; i++) {
                hash1 = ((hash1 << 5) - hash1) + seed1.charCodeAt(i);
                hash1 |= 0;
            }
            
            let targetNumber = Math.abs(hash1) % 10;
            let sizeResult = (targetNumber >= 5) ? "BIG" : "SMALL";
            
            return { size: sizeResult };
        }

        // --- Main Timer & UI Loop ---
        function loop() {
            if (!_active) return;
            
            // Check internet status. Hide completely if data cuts off during run.
            if (!navigator.onLine) {
                box.classList.add('hidden');
                document.getElementById('timer').innerText = "--";
                return;
            } else {
                box.classList.remove('hidden');
            }

            const now = new Date();
            const sec = now.getSeconds();
            
            const pBox = document.getElementById('periodID');
            if(lastP) {
                pBox.innerText = lastP;
            } else {
                pBox.innerText = "Syncing...";
            }
            
            let rem = 30 - (sec % 30);
            if (rem === 30) rem = 0; 
            
            document.getElementById('timer').innerText = rem < 10 ? "0" + rem : rem;

            const outputWrapper = document.getElementById('predictionOutput');

            // Show data analysis during the last 5 seconds of the 30-second window
            if (rem <= 4 || rem === 0) {
                outputWrapper.innerHTML = '<span class="processing">ANALYZING DATA...</span>';
                currentSignal = null;
                box.classList.remove('glow-big', 'glow-small');
            } else {
                if (!currentSignal) {
                    const result = analyzeQuantumSignal(lastP || "0");
                    currentSignal = result;
                    
                    // Render dynamic panel borders according to the signal status
                    if (result.size === "BIG") {
                        box.classList.add('glow-big');
                        box.classList.remove('glow-small');
                    } else {
                        box.classList.add('glow-small');
                        box.classList.remove('glow-big');
                    }
                    
                    outputWrapper.innerHTML = `
                        <div class="output-row">
                            <span class="size-txt res-${result.size.toLowerCase()}">${result.size}</span>
                        </div>
                    `;
                }
            }
        }
        
        // Initial setup execution
        updateConnectionStatus();
    </script>
</body>
</html>
